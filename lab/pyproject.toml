[project]
name = "dsp-lab"
version = "0.1.0"
description = "marimo notebooks for prototyping module algorithms"
requires-python = ">=3.13"
dependencies = [
    "dawdreamer>=0.9.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsplab"]

[tool.marimo.runtime]
auto_instantiate = true  # run the notebook when it opens
auto_reload = "autorun"  # re-run cells when dsplab/ changes
